<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermes Manager</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0b0e14;
    color: #e6e9ef;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    padding: 48px 20px 80px;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 28px; flex-wrap: wrap; }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .subtitle { color: #8b93a7; font-size: 14px; }
  .badge {
    margin-left: auto;
    background: #141a26;
    border: 1px solid #232b3b;
    color: #7aa2f7;
    font-size: 13px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 999px;
  }
  .card {
    background: #10141d;
    border: 1px solid #232b3b;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .form-row { display: flex; gap: 12px; flex-wrap: wrap; }
  input[type="text"], input[type="password"] {
    flex: 1 1 220px;
    background: #0b0e14;
    border: 1px solid #2a3346;
    border-radius: 8px;
    color: #e6e9ef;
    padding: 10px 12px;
    font-size: 14px;
    outline: none;
  }
  input:focus { border-color: #7aa2f7; }
  button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 18px;
  }
  .btn-primary { background: #7aa2f7; color: #0b0e14; }
  .btn-primary:hover { background: #8fb0f8; }
  .btn-primary:disabled { opacity: 0.55; cursor: default; }
  .hint { color: #8b93a7; font-size: 12.5px; margin-top: 12px; }
  .error-banner {
    background: #2a1215;
    border: 1px solid #5c1f26;
    color: #ff9aa2;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13.5px;
    margin-bottom: 16px;
  }
  .empty {
    text-align: center;
    color: #8b93a7;
    padding: 48px 0;
    font-size: 15px;
  }
  .instance {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #10141d;
    border: 1px solid #232b3b;
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 12px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .dot.running { background: #3fb950; box-shadow: 0 0 8px rgba(63,185,80,0.5); }
  .dot.exited { background: #8b93a7; }
  .dot.other { background: #f85149; }
  .meta { flex: 1; min-width: 0; }
  .name { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 15px; font-weight: 600; }
  .sub { color: #8b93a7; font-size: 12.5px; margin-top: 2px; }
  .actions { display: flex; gap: 8px; flex-shrink: 0; }
  .btn-link {
    background: #1a2231;
    color: #7aa2f7;
    text-decoration: none;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 600;
  }
  .btn-link:hover { background: #22304a; }
  .btn-danger { background: #2a1215; color: #ff9aa2; border: 1px solid #5c1f26; }
  .btn-danger:hover { background: #3a1a1f; }
  .btn-danger.confirm { background: #f85149; color: #0b0e14; border-color: #f85149; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Hermes Manager</h1>
    <span class="subtitle">isolated hermes agent instances</span>
    <span class="badge" id="count">0 running</span>
  </header>

  <div class="card">
    <form id="create-form" class="form-row">
      <input type="text" id="name" placeholder="Instance name (optional)" autocomplete="off">
      <input type="password" id="password" placeholder="Instance password (optional)" autocomplete="new-password">
      <button type="submit" class="btn-primary" id="create-btn">+ Create instance</button>
    </form>
    <p class="hint">First instance pulls the image and hermes-agent source, and every new instance installs agent deps on first boot — give it a few minutes before first open.</p>
  </div>

  <div id="error" class="error-banner" style="display:none"></div>
  <div id="list"></div>
</div>

<script>
const listEl = document.getElementById('list');
const errorEl = document.getElementById('error');
const countEl = document.getElementById('count');
const form = document.getElementById('create-form');
const nameInput = document.getElementById('name');
const passwordInput = document.getElementById('password');
const createBtn = document.getElementById('create-btn');
let pendingConfirm = 0;

function showError(msg) {
  errorEl.textContent = msg;
  errorEl.style.display = 'block';
}

function clearError() {
  errorEl.style.display = 'none';
}

function statusClass(status) {
  if (status === 'running') return 'running';
  if (status === 'exited') return 'exited';
  return 'other';
}

function render(instances) {
  const running = instances.filter((i) => i.status === 'running').length;
  countEl.textContent = running + ' running';

  if (!instances.length) {
    listEl.innerHTML = '<div class="empty">No instances yet</div>';
    return;
  }

  listEl.innerHTML = '';
  for (const inst of instances) {
    const row = document.createElement('div');
    row.className = 'instance';

    const dot = document.createElement('span');
    dot.className = 'dot ' + statusClass(inst.status);

    const meta = document.createElement('div');
    meta.className = 'meta';
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = inst.name;
    const sub = document.createElement('div');
    sub.className = 'sub';
    sub.textContent = inst.id + ' · ' + new Date(inst.created).toLocaleString() + (inst.port ? ' · :' + inst.port : '');
    meta.appendChild(name);
    meta.appendChild(sub);

    const actions = document.createElement('div');
    actions.className = 'actions';

    const link = document.createElement('a');
    link.className = 'btn-link';
    link.href = inst.url;
    link.target = '_blank';
    link.rel = 'noopener';
    link.textContent = 'Open ↗';

    const del = document.createElement('button');
    del.className = 'btn-danger';
    del.textContent = 'Delete';
    let armed = false;
    let timer = null;
    del.addEventListener('click', async () => {
      if (!armed) {
        armed = true;
        pendingConfirm++;
        del.textContent = 'Sure?';
        del.classList.add('confirm');
        timer = setTimeout(() => {
          armed = false;
          pendingConfirm--;
          del.textContent = 'Delete';
          del.classList.remove('confirm');
        }, 3000);
        return;
      }
      clearTimeout(timer);
      pendingConfirm--;
      del.disabled = true;
      try {
        const res = await fetch('/api/instances/' + inst.id, { method: 'DELETE' });
        if (!res.ok) throw new Error('delete failed');
        row.remove();
        refresh();
      } catch (err) {
        showError('Failed to delete instance: ' + err.message);
        del.disabled = false;
        armed = false;
        del.textContent = 'Delete';
        del.classList.remove('confirm');
      }
    });

    actions.appendChild(link);
    actions.appendChild(del);
    row.appendChild(dot);
    row.appendChild(meta);
    row.appendChild(actions);
    listEl.appendChild(row);
  }
}

async function refresh() {
  try {
    const res = await fetch('/api/instances');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    clearError();
    if (pendingConfirm === 0) render(data.instances);
  } catch (err) {
    showError('Failed to load instances: ' + err.message);
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  createBtn.disabled = true;
  createBtn.textContent = 'Creating…';
  clearError();
  try {
    const res = await fetch('/api/instances', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: nameInput.value.trim(),
        password: passwordInput.value,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'HTTP ' + res.status);
    nameInput.value = '';
    passwordInput.value = '';
    refresh();
  } catch (err) {
    showError('Failed to create instance: ' + err.message);
  } finally {
    createBtn.disabled = false;
    createBtn.textContent = '+ Create instance';
  }
});

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
