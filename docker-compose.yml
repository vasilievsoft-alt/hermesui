services:
  manager:
    build: .
    image: hermes-manager:latest
    restart: unless-stopped
    ports:
      - "${MANAGER_PORT:-3900}:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      ACCESS_MODE: ${ACCESS_MODE:-subdomain}
      BASE_DOMAIN: ${BASE_DOMAIN:-}
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      HERMES_IMAGE: ${HERMES_IMAGE:-ghcr.io/nesquena/hermes-webui:latest}
      MANAGER_PASSWORD: ${MANAGER_PASSWORD:-}
      INSTANCE_URL_SCHEME: ${INSTANCE_URL_SCHEME:-}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.hermes-instances.rule=HostRegexp(`^[a-z0-9-]+\\.${BASE_DOMAIN}`)"
      - "traefik.http.routers.hermes-instances.entrypoints=${TRAEFIK_ENTRYPOINTS:-web}"
      - "traefik.http.services.hermes-instances.loadbalancer.server.port=3000"
    networks:
      - hermes-net
      - dokploy-network

networks:
  hermes-net:
    name: hermes-net
  dokploy-network:
    external: true
