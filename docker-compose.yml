services:
  manager:
    build: .
    image: hermes-manager:latest
    restart: unless-stopped
    ports:
      - "${MANAGER_PORT:-3900}:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      ACCESS_MODE: ${ACCESS_MODE:-subdomain}
      BASE_DOMAIN: ${BASE_DOMAIN:-}
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      HERMES_IMAGE: ${HERMES_IMAGE:-ghcr.io/nesquena/hermes-webui:latest}
      MANAGER_PASSWORD: ${MANAGER_PASSWORD:-}
    networks:
      - hermes-net

networks:
  hermes-net:
    name: hermes-net