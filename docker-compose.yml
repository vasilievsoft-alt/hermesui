# Service intentionally named `manager` — matches the Dokploy domain binding
# from the previous deployment (domain → service manager, port 3000).
services:
  manager:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    # No host port mapping: Dokploy's Traefik reaches the container on its
    # internal port 3000 via the compose network. Direct IP access isn't
    # needed (and host :3000 is typically occupied by Dokploy itself).
    expose:
      - '3000'
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in .env}
      # Optional stable session secret across rebuilds:
      APP_SESSION_SECRET: ${APP_SESSION_SECRET:-}
      NODE_ENV: production
    volumes:
      - ./workspace:/workspace
      - config:/config

volumes:
  config:
