services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - '${UI_PORT:-3000}:3000'
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in .env}
      # Optional stable session secret across rebuilds:
      APP_SESSION_SECRET: ${APP_SESSION_SECRET:-}
      NODE_ENV: production
    volumes:
      - ./workspace:/workspace
      - config:/config

volumes:
  config:
